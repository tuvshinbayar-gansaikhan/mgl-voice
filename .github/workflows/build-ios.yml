name: Build IPA (device)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build DictusApp (iOS device)
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies\
            -project Dictus.xcodeproj\
            -scheme DictusApp

      - name: Build DictusApp (device, unsigned)
        run: |
          set -o pipefail    
          xcodebuild build\
            -project Dictus.xcodeproj\
            -scheme DictusApp\
            -configuration Debug\
            -destination 'generic/platform=iOS'\
            -derivedDataPath build/DerivedData\
            CODE_SIGNING_ALLOWED=NO\
            CODE_SIGNING_REQUIRED=NO\
            CODE_SIGNING_IDENTITY=""
      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Dictus-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dictus-unsigned-ipa
          path: Dictus-unsigned.ipa                 